stages:
  - check
  - build
  - target_test
  - deploy

workflow:
  rules:
    # Development branch pushes are covered by merge request pipelines.
    - if: '$CI_COMMIT_REF_NAME != "master" && $CI_COMMIT_BRANCH !~ /^release\/v/ && $CI_COMMIT_TAG !~ /^v\d+\.\d+(\.\d+)?($|-)/ && $CI_PIPELINE_SOURCE == "push"'
      when: never
    # The branch pipeline for a release commit has already run the same checks.
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+(\.\d+)?($|-)/'
      when: never
    - if: $CI_OPEN_MERGE_REQUESTS != null
      variables:
        PIPELINE_COMMIT_SHA: $CI_MERGE_REQUEST_SOURCE_BRANCH_SHA
    - if: $CI_OPEN_MERGE_REQUESTS == null
      variables:
        PIPELINE_COMMIT_SHA: $CI_COMMIT_SHA
    - when: always

variables:
  SKAINET_PATH: "$CI_PROJECT_DIR"
  BATCH_BUILD: "1"
  V: "0"
  IDF_CI_BUILD: "1"
  # The target_test stage is temporarily disabled. Set this to "1", either here or when
  # starting a pipeline manually, to run the tests on the runner boards again.
  RUN_TARGET_TEST: "0"

include:
  - ".gitlab/ci/pre_commit.yml"
  - ".gitlab/ci/build.yml"
  - ".gitlab/ci/target_test.yml"
  - ".gitlab/ci/deploy.yml"
